<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Gig Edge</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

  <h1>🚗 Gig Edge</h1>
  <p class="subtitle">Gig Offer Analyzer</p>

  <!-- RAPID DECISION -->
  <div class="card rapid-card">
    <div class="rapid-header">
      <h2>⚡ Rapid Decision</h2>
      <p>Make the fastest safe decision possible.</p>
    </div>

    <div class="rapid-grid">

      <div class="field">
        <label for="rapidPay">💰 Pay ($)</label>
        <input
          id="rapidPay"
          type="number"
          inputmode="decimal"
          step="0.01"
          autocomplete="off"
          placeholder="48.00">
      </div>

      <div class="field">
        <label for="rapidMiles">🚗 Offer Miles</label>
        <input
          id="rapidMiles"
          type="number"
          inputmode="decimal"
          step="0.1"
          autocomplete="off"
          placeholder="12">
      </div>

    </div>

    <div id="rapidResult" class="rapid-result" aria-live="polite">
      <div id="rapidDecision"></div>
      <div id="rapidRate"></div>
      <div id="rapidScore"></div>
    </div>

   <div id="pickupSection" class="pickup-section">
  <label>📍 Pickup Miles <span>(optional)</span></label>

  <div class="pickup-mode-buttons">
    <button id="autoPickupBtn" type="button" class="pickup-mode-btn">
      📍 AUTO
    </button>

    <button id="manualPickupBtn" type="button" class="pickup-mode-btn">
      ✏️ MANUAL
    </button>
  </div>

  <div id="autoPickupPanel" class="pickup-panel">
    <label for="pickupAddress">Pickup Address</label>

    <input
      id="pickupAddress"
      type="text"
      autocomplete="off"
      placeholder="Paste pickup address">

    <button id="getPickupMilesBtn" type="button">
      📍 Get Pickup Miles
    </button>

    <div id="pickupAutoStatus" aria-live="polite"></div>
  </div>

  <div id="manualPickupPanel" class="pickup-panel" style="display:none;">
    <label for="pickupMiles">Enter Pickup Miles</label>

    <input
      id="pickupMiles"
      type="number"
      inputmode="decimal"
      step="0.1"
      min="0"
      autocomplete="off"
      placeholder="Miles to pickup">
  </div>

  <div id="trueMilesResult" class="true-miles-result"></div>
</div>

    <button id="fullAnalysisBtn" type="button" class="secondary-button">
      🎯 Full Analysis
    </button>
  </div>


  <!-- FULL ANALYSIS -->
  <div id="fullAnalysis" class="card input-card">

    <div class="full-header">
      <h2>🎯 Full Analysis</h2>
      <p>Use when you have time for a complete evaluation.</p>
    </div>

    <div class="field">
      <label for="pay">💰 Order Pay ($)</label>
      <input id="pay" type="number" inputmode="decimal" step="0.01" autocomplete="off">
    </div>

    <div class="field">
      <label for="miles">🚗 Miles</label>
      <input id="miles" type="number" inputmode="decimal" step="0.1" autocomplete="off">
    </div>

    <div class="field">
      <label for="minutes">⏱ Minutes</label>
      <input id="minutes" type="number" inputmode="numeric" step="1" autocomplete="off">
    </div>

    <div class="field">
      <label for="drops">📦 Drop-Offs</label>
      <input id="drops" type="number" inputmode="numeric" step="1" autocomplete="off">
    </div>

    <button id="analyzeBtn" type="button">Analyze Offer</button>
  </div>


  <div id="quickDecision" class="quick-decision" aria-live="polite">
    <div id="quickDecisionText"></div>
    <div id="quickScore"></div>
  </div>


  <div class="card results-card">
    <h2>Results</h2>
    <p id="ppm">Pay Per Mile:</p>
    <p id="hourly">Gross Hourly:</p>
    <p id="score">Gig Score:</p>
    <p id="decision">Grade:</p>

    <h2>Driver Intelligence</h2>
    <p id="reason"></p>
  </div>

</div>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>

</body>
</html>
